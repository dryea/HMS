<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCFCFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-icon-180.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>SummitStay</title>
  <style>
    body { background: #FCFCFC; margin: 0; font-family: 'Outfit', sans-serif; }
    #splash { position: fixed; inset: 0; background: #FCFCFC; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash svg { width: 80px; height: 80px; }
  </style>
</head>
<body>
  <div id="splash"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect x="32" y="48" width="128" height="96" rx="8" fill="none" stroke="#4c6ef5" stroke-width="6"/><rect x="48" y="64" width="40" height="32" rx="4" fill="#4c6ef5"/><rect x="104" y="64" width="40" height="32" rx="4" fill="#4c6ef5"/><rect x="48" y="104" width="40" height="32" rx="4" fill="#4c6ef5"/><rect x="104" y="104" width="40" height="32" rx="4" fill="#4c6ef5"/><circle cx="96" cy="24" r="8" fill="#4c6ef5"/></svg></div>
  <div id="root"></div>
  <script>
    window.addEventListener('load', () => setTimeout(() => document.getElementById('splash')?.classList.add('hidden'), 300));
  </script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
